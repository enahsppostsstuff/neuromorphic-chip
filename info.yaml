project:
  title:        "Spiking Neural Processor"
  description:  "An 8x8 event driven neuromorphic processor utilizing 64 3bit signed weights."
  author:       "Your Name"
  language:     "SystemVerilog"
  clock_hz:     50000000
  tiles:        "1x1"
  top_module:   "tt_um_neural_processor"
  source_files:
    - "tt_um_neural_processor.v"

pinout:
  ui:
    - "input_spike_valid"
    - "input_neuron_id"
    - "input_neuron_id"
    - "input_neuron_id"
    - "cfg_write_en"
    - "cfg_weight_data"
    - "cfg_weight_data"
    - "cfg_weight_data"
  uo:
    - "output_spike_valid"
    - "output_neuron_id"
    - "output_neuron_id"
    - "output_neuron_id"
    - "unused"
    - "unused"
    - "unused"
    - "unused"
  uio:
    - "cfg_target_pre"
    - "cfg_target_pre"
    - "cfg_target_pre"
    - "cfg_target_post"
    - "cfg_target_post"
    - "cfg_target_post"
    - "unused"
    - "unused"

documentation:
  external_hw:  "None"
  discord:      "your_discord_username"
  doc_link:     "https://github.com"
  inputs:       "Strobe input_spike_valid with 3bit pre-synaptic ID, or activate cfg_write_en to flash weights."
  outputs:      "Pulses output_spike_valid alongside 3bit post-synaptic address ID whenever a neuron fires."
  bidirectional: "Configured as input buses mapping matrix coordinates for adjustments."
  how_it_works: "Implements event-driven leaky integrate-and-fire model layers tracking 64 weights and 8 states."
  how_to_test:  "Apply hardware reset, assert config lines, and strobe active valid spikes on input vectors."
